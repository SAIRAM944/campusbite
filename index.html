<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CampusBite Restaurant</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ff9800,#ff5722);
    padding:20px;
}

.container{
    width:100%;
    max-width:420px;
    background:white;
    border-radius:20px;
    padding:30px;
    text-align:center;
    box-shadow:0 15px 35px rgba(0,0,0,0.3);
}

.logo{
    width:100px;
    height:100px;
    border-radius:50%;
    background:#ff5722;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:40px;
    margin:auto;
    margin-bottom:20px;
}

h1{
    color:#ff5722;
    margin-bottom:5px;
    font-size:32px;
}

.tagline{
    color:#666;
    margin-bottom:25px;
    font-size:15px;
}

.btn{
    width:100%;
    padding:16px;
    margin:12px 0;
    border:none;
    border-radius:12px;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    color:white;
    transition:.3s;
}

.order{
    background:#28a745;
}

.kitchen{
    background:#007bff;
}

.admin{
    background:#dc3545;
}

.btn:hover{
    transform:scale(1.03);
    opacity:.9;
}

.footer{
    margin-top:25px;
    color:#555;
    font-size:14px;
}

#time{
    margin-top:10px;
    font-weight:bold;
    color:#ff5722;
}

/* Mobile */
@media(max-width:600px){

.container{
    padding:25px;
}

h1{
    font-size:28px;
}

.btn{
    font-size:17px;
    padding:15px;
}

.logo{
    width:80px;
    height:80px;
    font-size:34px;
}

}

/* Laptop/Desktop */
@media(min-width:768px){

.container{
    max-width:500px;
}

h1{
    font-size:36px;
}

.btn{
    font-size:20px;
}

}
</style>

</head>
<body>

<div class="container">

<div class="logo">🍽️</div>

<h1>CampusBite</h1>

<p class="tagline">Restaurant Management System</p>

<button class="btn order" onclick="goOrder()">
🛒 Order Food
</button>

<button class="btn kitchen" onclick="goKitchen()">
👨‍🍳 Kitchen Staff
</button>

<button class="btn admin" onclick="goAdmin()">
⚙️ Admin Panel
</button>

<div class="footer">

<p>Welcome to CampusBite</p>

<p id="time"></p>

</div>

</div>

<script>

function updateTime(){

const now=new Date();

document.getElementById("time").innerHTML=
now.toLocaleDateString()+"<br>"+now.toLocaleTimeString();

}

setInterval(updateTime,1000);

updateTime();

function goOrder(){
window.location.href="file:///C:/Users/himas/OneDrive/Desktop/campus%20bite/menu.html";
}

function goKitchen(){
window.location.href="file:///C:/Users/himas/OneDrive/Desktop/campus%20bite/kitchen%20staff.html";
}

function goAdmin(){
window.location.href="file:///C:/Users/himas/OneDrive/Desktop/campus%20bite/admin.html";
}

</script>

</body>
</html>
